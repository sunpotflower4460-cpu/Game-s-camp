name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run validate:recipes
      - run: npm run validate:kits
      - run: npm run validate:kit-registry
      - run: npm run validate:template-registry
      - run: npm run validate:compatibility
      - run: npm run plan:assembler
      - run: npm run generate:game
      - run: npm run check:generated-custom-safety
      - name: Ensure generated outputs are up-to-date
        run: git diff --exit-code generated/
      - name: Ensure custom/ was not touched by generation
        run: |
          git diff --exit-code custom/
          test -z "$(git status --porcelain custom/)"
      - name: Ensure reports are up-to-date
        run: git diff --exit-code reports/
      - run: npm run generate:schemas
      - name: Ensure schemas are up-to-date
        run: git diff --exit-code schemas/
      - run: npm run build
